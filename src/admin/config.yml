# ==========================================================
#  Locate Georgia — admin panel settings (Decap CMS)
#  After the site is on GitHub, replace YOUR-GITHUB-USERNAME below.
# ==========================================================
backend:
  name: github
  repo: dargvantsa/locate-georgia-website
  branch: main
  base_url: https://api.netlify.com
  commit_messages:
    create: "Add {{collection}} “{{slug}}”"
    update: "Update {{collection}} “{{slug}}”"
    delete: "Delete {{collection}} “{{slug}}”"
    uploadMedia: "Upload photo “{{path}}”"
    deleteMedia: "Delete photo “{{path}}”"

# Lets the admin panel work on your computer without logging in (npx decap-server)
local_backend: true

site_url: https://locategeorgia.ge
display_url: https://locategeorgia.ge
logo_url: /img/logo-terracotta.png

media_folder: src/img/uploads
public_folder: /img/uploads

collections:
  # ---------------- Tours ----------------
  - name: tours
    label: Tours
    label_singular: Tour
    description: Every tour on the website. Tick "Show on homepage" for up to 9 signature journeys (shown 3 at a time in a slider).
    folder: src/tours
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{title}}  ·  from €{{price}}"
    sortable_fields: [order, title, price]
    fields:
      - { label: Tour name, name: title, widget: string }
      - { label: Short description, name: summary, widget: text, hint: "One or two sentences. Shown at the top of the tour page and in Google results." }
      - { label: Duration (days), name: duration, widget: number, value_type: int, min: 1, required: false }
      - { label: Price from (€ per person), name: price, widget: number, value_type: int, min: 0, required: false }
      - { label: Main photo, name: image, widget: image, hint: "Landscape photo, at least 1600px wide." }
      - { label: Photo description, name: image_alt, widget: string, required: false, hint: "What the photo shows, e.g. 'Gergeti Trinity Church under Mount Kazbek'. Helps Google and blind visitors." }
      - label: Travel style
        name: styles
        widget: select
        multiple: true
        required: false
        hint: "Used by the search box on the homepage and Tours page."
        options: [{ label: Private journey, value: private }, { label: Small group, value: group }, { label: Family holiday, value: family }, { label: Romantic holiday, value: romantic }, { label: Winter tour, value: winter }]
      - label: Themes
        name: interests
        widget: select
        multiple: true
        required: false
        options: [{ label: History & culture, value: culture }, { label: Wine, value: wine }, { label: Food & gastronomy, value: food }, { label: Mountains & nature, value: nature }, { label: Medical & wellness, value: wellness }]
      - { label: Highlights, name: highlights, widget: list, required: false, field: { label: Highlight, name: text, widget: string } }
      - label: Itinerary (day by day)
        name: itinerary
        widget: list
        required: false
        summary: "Day {{fields.day}}: {{fields.title}}"
        fields:
          - { label: Day, name: day, widget: string, hint: "e.g. 1 or 3–4" }
          - { label: Title, name: title, widget: string }
          - { label: Description, name: text, widget: text, required: false }
      - { label: Included, name: included, widget: list, required: false, field: { label: Item, name: text, widget: string } }
      - { label: Not included, name: not_included, widget: list, required: false, field: { label: Item, name: text, widget: string } }
      - { label: Show on homepage, name: featured, widget: boolean, default: false }
      - { label: Order, name: order, widget: number, value_type: int, default: 10, hint: "Lower numbers appear first." }
      - { label: Published, name: published, widget: boolean, default: true, hint: "Switch off to hide the tour without deleting it." }
      - { label: Extra text, name: body, widget: markdown, required: false, hint: "Shown instead of the itinerary when no days are added." }

  # ---------------- Journal ----------------
  - name: journal
    label: Blog
    label_singular: Blog post
    folder: src/journal
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{title}} ({{year}}-{{month}}-{{day}})"
    sortable_fields: [date, title]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, date_format: "DD MMM YYYY", time_format: false, format: "YYYY-MM-DD" }
      - { label: Short description, name: summary, widget: text, required: false }
      - { label: Cover photo, name: image, widget: image, required: false }
      - { label: Photo description, name: image_alt, widget: string, required: false }
      - { label: Published, name: published, widget: boolean, default: true }
      - { label: Text, name: body, widget: markdown }

  # ---------------- Pages ----------------
  - name: pages
    label: Pages
    editor: { preview: false }
    files:
      - name: home
        label: Homepage
        file: src/_data/home.json
        fields:
          - label: Top banner
            name: hero
            widget: object
            collapsed: false
            fields:
              - { label: Headline line 1, name: title_line_1, widget: string }
              - { label: Headline line 2 (italic), name: title_line_2, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Button label, name: button_label, widget: string }
              - label: Slideshow photos
                name: slides
                widget: list
                min: 1
                max: 5
                summary: "{{fields.location}}"
                hint: "Add 2–3 photos. Each one shows for 3 seconds, then fades to the next. Drag to change the order. Wide landscape photos, at least 2400px wide; a calmer left side works best under the text."
                fields:
                  - { label: Photo, name: image, widget: image }
                  - { label: Photo location, name: location, widget: string, required: false, hint: "Shown bottom-right, e.g. 'Ushguli, Svaneti'. Leave empty to hide." }
          - label: Three promises (under the search bar)
            name: promises
            widget: list
            min: 3
            max: 3
            allow_add: false
            field: { label: Text, name: text, widget: string }
          - label: Signature journeys section
            name: journeys
            widget: object
            hint: "The tours shown here are the ones ticked 'Show on homepage' under Tours (up to 9, three at a time in a slider)."
            fields:
              - { label: Small heading, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Link label, name: link_label, widget: string }
          - label: Welcome section
            name: welcome
            widget: object
            fields:
              - { label: Small heading, name: eyebrow, widget: string }
              - { label: Title line 1, name: title_line_1, widget: string }
              - { label: Title line 2, name: title_line_2, widget: string, required: false, hint: "Optional second line." }
              - { label: Text, name: text, widget: text }
              - { label: Link label, name: link_label, widget: string }
              - { label: Photo, name: image, widget: image, hint: "Works best as a portrait or square photo." }
              - { label: Photo description, name: image_alt, widget: string, required: false }
              - { label: Handwritten note, name: handwritten_note, widget: text, required: false, hint: "Press Enter for a new line." }
          - label: Terracotta banner (shown on every page)
            name: cta
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Button label, name: button_label, widget: string }
              - { label: Small text, name: note, widget: text }

      - name: about
        label: About us & team
        file: src/_data/team.json
        fields:
          - { label: Small heading, name: eyebrow, widget: string, required: false, hint: "Optional small text above the title." }
          - { label: Page title, name: title, widget: text, hint: "Press Enter for a new line. The second line is shown in italics." }
          - { label: Top photo, name: hero_image, widget: image, hint: "Wide landscape photo." }
          - { label: Mission heading, name: intro_title, widget: string, required: false }
          - { label: Mission text, name: intro, widget: text }
          - label: Numbers
            name: highlights
            widget: list
            summary: "{{fields.number}} {{fields.label}}"
            fields:
              - { label: Number, name: number, widget: string, hint: "e.g. 2017, 10+, 24/7" }
              - { label: Label, name: label, widget: string }
          - { label: Story heading, name: story_title, widget: string }
          - { label: Story, name: story, widget: text, hint: "Leave an empty line between paragraphs." }
          - { label: Story photo, name: story_image, widget: image }
          - { label: Story photo description, name: story_image_alt, widget: string, required: false }
          - { label: Story photo caption, name: story_image_caption, widget: string, required: false, hint: "Shown at the bottom of the photo, e.g. 'CEO, Gvantsa Darchia'." }
          - { label: Values heading, name: values_title, widget: string }
          - label: Values
            name: values
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text }
          - { label: Team heading, name: team_title, widget: string }
          - { label: Team text, name: team_intro, widget: string }
          - label: Team members
            name: members
            widget: list
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Role, name: role, widget: string }
              - { label: Email, name: email, widget: string, required: false }
              - { label: Photo, name: photo, widget: image, required: false }

      - name: partner
        label: B2B partnership form
        file: src/_data/partner.json
        fields:
          - { label: Heading, name: title, widget: text }
          - { label: Photo, name: image, widget: image }
          - { label: Photo description, name: image_alt, widget: string, required: false }
          - { label: Button label, name: button_label, widget: string }
          - { label: Thank-you message, name: success_message, widget: text }

      - name: tours_page
        label: Tours page
        file: src/_data/toursPage.json
        fields:
          - { label: Title line 1, name: title_line_1, widget: string }
          - { label: Title line 2 (italic), name: title_line_2, widget: string, required: false }
          - { label: Top photo, name: image, widget: image }
          - { label: Introduction, name: intro, widget: text, required: false }

      - name: services
        label: Travel services
        file: src/_data/services.json
        fields:
          - label: Main services
            name: core
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Service, name: title, widget: string }
              - { label: Description, name: text, widget: text }
              - { label: Photo, name: image, widget: image, required: false }
          - label: Special services
            name: special
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Service, name: title, widget: string }
              - { label: Description, name: text, widget: text }
              - { label: Photo, name: image, widget: image, required: false }

  # ---------------- Settings ----------------
  - name: settings
    label: Contact & settings
    editor: { preview: false }
    files:
      - name: site
        label: Contact details & social links
        file: src/_data/site.json
        fields:
          - { label: Company name, name: name, widget: string }
          - { label: Legal name (footer), name: legal_name, widget: string }
          - { label: Top bar text, name: topbar_tagline, widget: string }
          - { label: Google description, name: meta_description, widget: text, hint: "Shown under your name in Google results. About 150 characters." }
          - { label: Email, name: email, widget: string }
          - { label: Phone 1, name: phone_1, widget: string }
          - { label: Phone 2, name: phone_2, widget: string, required: false }
          - { label: Address, name: address, widget: string }
          - { label: WhatsApp link, name: whatsapp, widget: string, required: false }
          - { label: Instagram, name: instagram, widget: string, required: false }
          - { label: Facebook, name: facebook, widget: string, required: false }
          - { label: LinkedIn, name: linkedin, widget: string, required: false }
          - { label: YouTube, name: youtube, widget: string, required: false }
          - { label: Footer tagline, name: footer_tagline, widget: text, hint: "Press Enter for a new line." }
